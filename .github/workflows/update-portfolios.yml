name: Update portfolio returns

# Paused. atlaswealth.cc is a contact-only page and must not publish
# portfolio figures. This file intentionally has no schedule. A manual
# run exits without fetching prices or writing data/portfolios.json.
# The previous workflow and site are on the full-site-backup branch.
# Restore that branch onto the publishing branch before collecting figures again.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Paused
        run: |
          echo "Paused. This workflow does not fetch prices or publish portfolio figures."
          echo "The previous site is on the full-site-backup branch."
          exit 0

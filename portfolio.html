<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Wealth</title>

    <!-- Embedded Geometric Atlas SVG Favicon (Monochrome) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><line x1='4' y1='32' x2='36' y2='32' stroke='%230F172A' stroke-width='3' stroke-linecap='round'/><path d='M20 6L32 32H8L20 6Z' stroke='%230F172A' stroke-width='3' stroke-linejoin='round' fill='none'/><circle cx='20' cy='22' r='3' fill='%230F172A'/></svg>">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #FAF9F6;
            color: #0F172A;
            min-height: 100vh;
            line-height: 1.6;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px 32px;
        }

        .brand-logo, .brand-logo:visited, .brand-logo:hover, .brand-logo:active {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            gap: 18px;
            text-decoration: none !important;
            color: #0F172A;
        }

        .brand-mark {
            width: 44px;
            height: 44px;
        }

        .brand-name {
            font-size: 17pt;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #0F172A;
            white-space: nowrap;
        }

        .brand-name-atlas {
            font-weight: 800;
        }

        .brand-name-wealth {
            font-weight: 300;
            opacity: 0.65;
        }

        .brand-slash {
            font-weight: 700;
            color: #0F172A;
            display: inline-block;
            transform: scaleY(0.88) translateY(-1px);
            margin: 0 -1px;
        }

        .poster {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 60px 48px;
        }

        .detail-main {
            width: 100%;
            max-width: 880px;
            margin-top: 72px;
            margin-bottom: 64px;
        }

        .scroll-cue,
        .scroll-cue:visited,
        .scroll-cue:hover,
        .scroll-cue:active {
            display: block;
            width: fit-content;
            font-size: 8pt;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #94A3B8;
            text-decoration: none;
            margin-bottom: 28px;
            transition: opacity 0.2s ease;
        }

        .scroll-cue:hover {
            opacity: 0.6;
        }

        .headline {
            font-size: 22pt;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #0F172A;
            line-height: 1.35;
            margin-bottom: 20px;
        }

        .sub-headline {
            font-size: 11pt;
            color: #475569;
            line-height: 1.7;
        }

        .c-ret {
            font-size: 22pt;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.15;
            color: #0F172A;
        }

        .c-label {
            margin-top: 6px;
            font-size: 8.5pt;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #94A3B8;
        }

        .metric-line {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            max-width: 420px;
            margin-top: 10px;
            font-size: 11pt;
            line-height: 1.4;
        }

        .c-label + .metric-line {
            margin-top: 18px;
        }

        .metric-k {
            color: #475569;
        }

        .metric-v {
            color: #0F172A;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .holdings {
            margin-top: 48px;
            border-top: 1px solid #E2E8F0;
        }

        .as-of {
            margin-top: 24px;
            font-size: 8.5pt;
            color: #94A3B8;
        }

        .h-row {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr 1fr;
            gap: 12px;
            align-items: baseline;
            padding: 14px 0;
            border-bottom: 1px solid #E2E8F0;
            font-size: 11pt;
        }

        .h-head {
            font-size: 8.5pt;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #94A3B8;
        }

        .h-ticker {
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .h-num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .h-lab {
            display: none;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px 32px;
            border-top: 1px solid #E2E8F0;
            padding-top: 24px;
            margin-top: auto;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .nav-link {
            font-size: 9.5pt;
            font-weight: 600;
            color: #0F172A;
            text-decoration: none;
            white-space: nowrap;
            transition: opacity 0.2s ease;
        }

        .nav-link:hover:not(.partner-btn) {
            opacity: 0.6;
        }

        .contact-link {
            color: #0F172A;
        }

        .partner-btn,
        .partner-btn:visited,
        .partner-btn:active {
            opacity: 1;
            padding: 8px 14px;
            border: 1px solid #0F172A;
            border-radius: 4px;
            line-height: 1;
            color: #0F172A;
            background-color: transparent;
            transition: none;
        }

        .partner-btn:hover {
            opacity: 1;
            background-color: #0F172A;
            color: #ffffff;
        }

        .copyright {
            font-size: 8.5pt;
            color: #94A3B8;
        }

        @media (max-width: 800px) {
            header { flex-direction: column; align-items: flex-start; gap: 20px; }
        }

        @media (max-width: 640px) {
            .poster { padding: 36px 24px; }
            .headline { font-size: 17pt; }
            .brand-mark { width: 36px; height: 36px; }
            .brand-name { font-size: 14pt; letter-spacing: 3px; }
            header { flex-direction: column; align-items: flex-start; gap: 20px; }
            .c-ret { font-size: 17pt; }
            .detail-main { margin-top: 48px; }
            footer { flex-direction: column; align-items: flex-start; gap: 16px; }
            .nav-links { flex-direction: column; align-items: flex-start; gap: 12px; }
            .h-head { display: none; }
            .h-row {
                grid-template-columns: 1fr auto;
                gap: 4px 16px;
                padding: 16px 0;
            }
            .h-return { grid-column: 2; grid-row: 1; }
            .h-start, .h-now {
                grid-column: 1 / -1;
                text-align: left;
                font-size: 8.5pt;
                color: #94A3B8;
            }
            .h-lab {
                display: inline;
                margin-right: 8px;
                font-size: 8.5pt;
                font-weight: 600;
                letter-spacing: 1.2px;
                text-transform: uppercase;
            }
            .h-return .h-lab { display: none; }
        }
    </style>
</head>
<body>

    <section class="poster">
        <header>
            <a href="index.html" class="brand-logo" aria-label="Atlas Wealth">
                <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="4" y1="32" x2="36" y2="32" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M20 6L32 32H8L20 6Z" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>
                    <circle cx="20" cy="22" r="2.5" fill="#0F172A"/>
                </svg>
                <span class="brand-name">
                    <span class="brand-name-atlas">ATLAS</span><span class="brand-name-wealth">WEA<span class="brand-slash">\</span>TH</span>
                </span>
            </a>
            <nav class="nav-links" aria-label="Primary">
                <a href="https://strategy.atlaswealth.cc" class="nav-link">Research Repository & Portal →</a>
                <a href="mailto:investors@atlaswealth.cc" class="nav-link partner-btn">Partner inquiries →</a>
            </nav>
        </header>

        <main class="detail-main">
            <a class="scroll-cue" href="index.html#performance">← Portfolio performance</a>
            <h1 class="headline" id="name"></h1>
            <div id="metrics"></div>
            <div class="holdings" id="holdings"></div>
            <p class="as-of" id="as-of">Past performance is not indicative of future results.</p>
        </main>

        <footer>
            <nav class="nav-links" aria-label="Footer">
                <a href="https://strategy.atlaswealth.cc" class="nav-link">Research Repository & Portal →</a>
                <a href="mailto:investors@atlaswealth.cc" class="nav-link contact-link">Partner Inquiries</a>
            </nav>
            <div class="copyright">
                © Atlas Capital Research. Confidential Policy Portal.
            </div>
        </footer>
    </section>

    <script>
        function el(tag, className, text) {
            var node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }

        var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        function formatAsOf(iso) {
            var parts = String(iso).split('-');
            var month = MONTHS[Number(parts[1]) - 1] || '';
            return month + ' ' + Number(parts[2]) + ', ' + parts[0];
        }

        function renderAsOf(iso) {
            var node = document.getElementById('as-of');
            if (!node || !iso) return;
            node.textContent = 'As of ' + formatAsOf(iso) + ' close · Past performance is not indicative of future results.';
        }

        function formatTotal(value) {
            var n = Number(value);
            var digits = Math.abs(n).toFixed(1) + '%';
            if (n > 0) return '+' + digits;
            if (n < 0) return '-' + digits;
            return digits;
        }

        function formatWeight(fraction) {
            return (Number(fraction) * 100).toFixed(1) + '%';
        }

        function metricLine(label, value) {
            var line = el('div', 'metric-line');
            line.appendChild(el('span', 'metric-k', label));
            line.appendChild(el('span', 'metric-v', value));
            return line;
        }

        function currentWeights(holdings) {
            var ready = holdings.length && holdings.every(function (holding) {
                return holding.return_pct !== undefined && holding.return_pct !== null && holding.start_weight != null;
            });
            if (!ready) return null;
            var growth = holdings.map(function (holding) {
                return Number(holding.start_weight) * (1 + Number(holding.return_pct) / 100);
            });
            var sum = growth.reduce(function (total, value) { return total + value; }, 0);
            if (!sum) return null;
            return growth.map(function (value) { return value / sum; });
        }

        function weightCell(className, label, value) {
            var cell = el('div', className);
            cell.appendChild(el('span', 'h-lab', label));
            cell.appendChild(document.createTextNode(value));
            return cell;
        }

        function render(portfolio) {
            document.title = portfolio.name + ' · Atlas Wealth';
            document.getElementById('name').textContent = portfolio.name;
            var metrics = document.getElementById('metrics');
            metrics.replaceChildren();
            metrics.appendChild(el('div', 'c-ret', formatTotal(portfolio.total_return_pct)));
            metrics.appendChild(el('div', 'c-label', 'Since inception'));
            metrics.appendChild(metricLine('Annualized', formatTotal(portfolio.cagr_pct)));
            metrics.appendChild(metricLine('YTD', formatTotal(portfolio.ytd_pct)));

            var holdings = portfolio.holdings || [];
            var drifted = currentWeights(holdings);
            var root = document.getElementById('holdings');
            root.replaceChildren();

            var head = el('div', 'h-row h-head');
            head.appendChild(el('div', '', 'Ticker'));
            head.appendChild(el('div', 'h-num', 'Start weight'));
            head.appendChild(el('div', 'h-num', 'Current weight'));
            head.appendChild(el('div', 'h-num', 'Return'));
            root.appendChild(head);

            holdings.forEach(function (holding, index) {
                var row = el('div', 'h-row');
                row.appendChild(el('div', 'h-ticker', holding.ticker));
                row.appendChild(weightCell('h-num h-start', 'Start weight', formatWeight(holding.start_weight)));
                var now = drifted ? formatWeight(drifted[index]) : '—';
                row.appendChild(weightCell('h-num h-now', 'Current weight', now));
                var ret = (holding.return_pct === undefined || holding.return_pct === null) ? '—' : formatTotal(holding.return_pct);
                row.appendChild(weightCell('h-num h-return', 'Return', ret));
                root.appendChild(row);
            });
        }

        function showMessage(text) {
            document.getElementById('name').textContent = 'Portfolio';
            document.getElementById('metrics').textContent = text;
        }

        var params = new URLSearchParams(window.location.search);
        var id = (params.get('id') || '').toLowerCase();

        fetch('data/portfolios.json')
            .then(function (response) {
                if (!response.ok) throw new Error('status');
                return response.json();
            })
            .then(function (data) {
                renderAsOf(data.as_of);
                var match = (data.portfolios || []).filter(function (portfolio) {
                    return String(portfolio.id).toLowerCase() === id;
                })[0];
                if (!match) {
                    showMessage('This portfolio could not be found.');
                    return;
                }
                render(match);
            })
            .catch(function () {
                showMessage('Portfolio performance could not be loaded.');
            });
    </script>

</body>
</html>

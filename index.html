<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Atlas Wealth</title>

    <!-- Embedded Geometric Atlas SVG Favicon (Monochrome) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><line x1='4' y1='32' x2='36' y2='32' stroke='%230F172A' stroke-width='2.5' stroke-linecap='round'/><path d='M20 6L32 32H8L20 6Z' stroke='%230F172A' stroke-width='2.5' stroke-linejoin='round' fill='none'/><circle cx='20' cy='22' r='3' fill='%230F172A'/></svg>">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            color-scheme: light;
            background-color: #FAF9F6;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #FAF9F6;
            color: #0F172A;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 48px 14vh;
            line-height: 1.5;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .brand-name {
            font-size: 17pt;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #0F172A;
            white-space: nowrap;
            line-height: 1;
            /* Drop the trailing tracking gap so the lockup centers on its letters. */
            margin-right: -4px;
        }

        .brand-name-atlas {
            font-weight: 800;
        }

        .brand-name-wealth {
            font-weight: 300;
            opacity: 0.65;
        }

        .brand-slash {
            font-weight: 700;
            color: #0F172A;
            display: inline-block;
            transform: scaleY(0.88) translateY(-1px);
            margin: 0 -1px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .contact {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px 14px;
            margin-top: 24px;
            font-size: 11pt;
            line-height: 1.4;
        }

        .contact-label {
            font-weight: 600;
            color: #475569;
        }

        .contact a {
            color: #0F172A;
            font-weight: 400;
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
            text-decoration-color: rgba(15, 23, 42, 0.35);
            white-space: nowrap;
        }

        .contact a:hover {
            text-decoration-color: #0F172A;
        }

        .contact a:focus-visible {
            outline: 2px solid #0F172A;
            outline-offset: 4px;
            border-radius: 2px;
        }

        @media (max-width: 640px) {
            body {
                padding: 36px 24px 12vh;
            }

            .brand-mark {
                width: 36px;
                height: 36px;
            }

            .brand-name {
                font-size: 14pt;
                letter-spacing: 3px;
                margin-right: -3px;
            }

            .contact {
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">
            <svg class="brand-mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <line x1="4" y1="32" x2="36" y2="32" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M20 6L32 32H8L20 6Z" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>
                <circle cx="20" cy="22" r="2.5" fill="#0F172A"/>
            </svg>
            <h1 class="brand-name">
                <span class="brand-name-atlas" aria-hidden="true">ATLAS</span><span class="brand-name-wealth" aria-hidden="true">WEA<span class="brand-slash">\</span>TH</span>
                <span class="sr-only">Atlas Wealth</span>
            </h1>
        </div>
        <p class="contact">
            <span class="contact-label">Contact</span>
            <a href="mailto:investors@atlaswealth.cc">investors@atlaswealth.cc</a>
        </p>
    </main>
</body>
</html>
